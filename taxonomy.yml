# Filler an intent may not contain: an intent that could have been written
# without opening the file is a failed intent. Matched on word boundaries.
# `common` is banned as filler, not as a word: "a wordlist of common terms" is
# the failure, while "the 500 most common passwords in the 2021 breach" is the
# kind of sentence this project exists to get. Measured on twenty live entries,
# banning the bare word cost one good intent in twenty.
banned: ["wordlist", "wordlists", "list of", "lists of", "common terms",
         "common words", "common names", "commonly used", "various",
         "used for fuzzing", "assorted", "a variety of", "miscellaneous"]

# An axis with no vocabulary: freshness is the four-digit year the contents
# imply. Listed so the census reports it like any other axis.
open_axes: [freshness]

# An intent shorter than this says nothing an agent can act on.
min_intent: 30

# Distinct intents divided by entries qualified by a model. ronin-wordlists
# scores 0.019; a run below this writes nothing.
distinctness: 0.95
