# Controlled vocabulary for the axes. Adding a value is one line here;
# qualification rejects anything not listed rather than recording it.
axes:
  target: [directory, file, extension, parameter, api-route, subdomain, vhost,
           username, password, header, server-variable, injection-payload]

  tech: [generic, apache, nginx, iis, lighttpd, tomcat, jetty, jboss, weblogic,
         websphere, coldfusion, php, asp, aspnet, jsp, java, struts, spring,
         python, django, flask, fastapi, ruby, rails, nodejs, express, perl, cgi,
         dotnet, golang, laravel, symfony, codeigniter, cakephp, zend, nextjs,
         wordpress, joomla, drupal, magento, typo3, sharepoint, confluence,
         jira, jenkins, gitlab, grafana, kibana, elasticsearch, redis, mongodb,
         mysql, mssql, oracle, postgresql, sqlite, db2, informix, firebird,
         sybase, graphql, soap, wsdl, ssti, xml, json, ldap, smb, ftp, ssh,
         smtp, snmp, dns, voip, windows, linux, unix, macos, android, ios,
         docker, kubernetes, aws, azure, gcp, cisco, fortinet, citrix, vmware,
         sap, iot, scada, prometheus, keycloak, kafka, rabbitmq, zookeeper,
         consul, solr, nagios, zabbix, splunk, phpmyadmin, webmin, cpanel]

  # What an entry physically is. Absent means `wordlist`, so one grep for
  # "kind" lists every installed file that is not one.
  kind: [wordlist, payload-file, source-code, structured-data, binary]

  provenance: [curated, real-world, generated, leaked]

  language: [generic, english, spanish, french, german, dutch, danish, swedish,
             norwegian, finnish, italian, portuguese, polish, russian,
             ukrainian, czech, slovak, hungarian, romanian, greek, turkish,
             arabic, hebrew, persian, hindi, chinese, japanese, korean, thai,
             vietnamese, indonesian, catalan, latin]

  shape: [bare-word, rooted-path, name-with-extension, bare-extension, url]

  order: [alphabetical, frequency, suspected-frequency, unknown]

  case: [lower, mixed]

# Anything the model might plausibly say that means a canonical value.
